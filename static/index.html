<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Agent Transport Layer</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      button {
        padding: 0.6rem 1rem;
        margin-right: 0.6rem;
        cursor: pointer;
      }

      #status {
        margin-top: 1rem;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Transport Layer (Daily WebRTC)</h1>
    <p>Transport + audio pipeline demo (mic → ASR → LLM → TTS).</p>

    <button id="join">Join Room</button>
    <button id="leave" disabled>Leave Room</button>
    <button id="startMic">Start Mic</button>
    <button id="stopMic" disabled>Stop Mic + Send</button>

    <div id="status">Idle</div>

    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <script>
      const status = document.getElementById("status");
      const joinBtn = document.getElementById("join");
      const leaveBtn = document.getElementById("leave");
      const startMicBtn = document.getElementById("startMic");
      const stopMicBtn = document.getElementById("stopMic");

      let callObject = null;
      let ws = null;
      let mediaRecorder = null;
      let micChunks = [];
      let activeMicStream = null;

      let currentAssistantAudio = null;
      let currentAssistantAudioUrl = null;

      let vadAudioContext = null;
      let vadSourceNode = null;
      let vadAnalyserNode = null;
      let vadIntervalId = null;
      let maxRecordTimeoutId = null;
      let vadLastSpeechAt = 0;
      let vadDetectedSpeech = false;

      const VAD_POLL_MS = 100;
      const VAD_SILENCE_MS = 450;
      const VAD_MAX_RECORDING_MS = 15000;
      const VAD_RMS_THRESHOLD = 0.02;

      function setStatus(message) {
        status.textContent = message;
      }

      function stopAssistantPlayback() {
        if (currentAssistantAudio) {
          currentAssistantAudio.pause();
          currentAssistantAudio.currentTime = 0;
          currentAssistantAudio = null;
        }
        if (currentAssistantAudioUrl) {
          URL.revokeObjectURL(currentAssistantAudioUrl);
          currentAssistantAudioUrl = null;
        }
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
      }

      function speakInBrowser(text) {
        if (!text || !window.speechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }

      function stopVadMonitoring() {
        if (vadIntervalId) {
          clearInterval(vadIntervalId);
          vadIntervalId = null;
        }
        if (maxRecordTimeoutId) {
          clearTimeout(maxRecordTimeoutId);
          maxRecordTimeoutId = null;
        }
        if (vadSourceNode) {
          vadSourceNode.disconnect();
          vadSourceNode = null;
        }
        if (vadAnalyserNode) {
          vadAnalyserNode.disconnect();
          vadAnalyserNode = null;
        }
        if (vadAudioContext) {
          vadAudioContext.close().catch(() => {});
          vadAudioContext = null;
        }
      }

      function stopMicStream() {
        if (!activeMicStream) return;
        activeMicStream.getTracks().forEach((track) => track.stop());
        activeMicStream = null;
      }

      function stopRecording(sendAudio = true, reason = "manual") {
        if (!mediaRecorder || mediaRecorder.state === "inactive") return;
        mediaRecorder._shouldSendAudio = sendAudio;
        mediaRecorder._stopReason = reason;
        mediaRecorder.stop();
      }

      function startVadMonitoring(stream) {
        vadAudioContext = new AudioContext();
        vadSourceNode = vadAudioContext.createMediaStreamSource(stream);
        vadAnalyserNode = vadAudioContext.createAnalyser();
        vadAnalyserNode.fftSize = 2048;
        vadSourceNode.connect(vadAnalyserNode);

        const samples = new Float32Array(vadAnalyserNode.fftSize);
        vadLastSpeechAt = Date.now();
        vadDetectedSpeech = false;

        vadIntervalId = setInterval(() => {
          if (!mediaRecorder || mediaRecorder.state === "inactive") return;

          vadAnalyserNode.getFloatTimeDomainData(samples);

          let sum = 0;
          for (let i = 0; i < samples.length; i++) {
            sum += samples[i] * samples[i];
          }
          const rms = Math.sqrt(sum / samples.length);

          if (rms >= VAD_RMS_THRESHOLD) {
            vadDetectedSpeech = true;
            vadLastSpeechAt = Date.now();
            return;
          }

          if (vadDetectedSpeech && Date.now() - vadLastSpeechAt >= VAD_SILENCE_MS) {
            setStatus("VAD: silence detected, sending audio...");
            stopRecording(true, "vad_silence");
          }
        }, VAD_POLL_MS);

        maxRecordTimeoutId = setTimeout(() => {
          if (!mediaRecorder || mediaRecorder.state === "inactive") return;
          setStatus("VAD: max utterance reached, sending audio...");
          stopRecording(true, "max_duration");
        }, VAD_MAX_RECORDING_MS);
      }

      function connectPipelineSocket() {
        if (ws && ws.readyState === WebSocket.OPEN) return;
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${protocol}://${location.host}/ws/audio-pipeline`);

        ws.onopen = () => setStatus("Audio pipeline connected");
        ws.onclose = () => setStatus("Audio pipeline disconnected");
        ws.onerror = () => setStatus("Audio pipeline socket error");

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "ready") {
              setStatus("Pipeline ready");
              return;
            }
            if (data.type === "processing") {
              setStatus("Processing audio...");
              return;
            }
            if (data.type === "pipeline_result") {
              const msg = `Transcript: ${data.transcript}\nAssistant: ${data.assistant_text}`;
              setStatus(msg);

              if (data.assistant_audio_b64 && data.assistant_audio_mime) {
                const binary = atob(data.assistant_audio_b64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                  bytes[i] = binary.charCodeAt(i);
                }
                const blob = new Blob([bytes], { type: data.assistant_audio_mime });

                stopAssistantPlayback();
                currentAssistantAudioUrl = URL.createObjectURL(blob);
                currentAssistantAudio = new Audio(currentAssistantAudioUrl);
                currentAssistantAudio.onended = () => {
                  if (currentAssistantAudioUrl) {
                    URL.revokeObjectURL(currentAssistantAudioUrl);
                    currentAssistantAudioUrl = null;
                  }
                  currentAssistantAudio = null;
                };
                currentAssistantAudio.play().catch((error) => {
                  setStatus("Playback error: " + error.message);
                });
              } else {
                stopAssistantPlayback();
                speakInBrowser(data.assistant_text);
              }
              return;
            }
            if (data.type === "error") {
              setStatus("Pipeline error: " + data.error);
            }
          } catch (error) {
            setStatus("Invalid pipeline message: " + error.message);
          }
        };
      }

      async function getToken() {
        const response = await fetch("/api/transport/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_name: "dev-client" }),
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

        return response.json();
      }

      joinBtn.addEventListener("click", async () => {
        try {
          connectPipelineSocket();
          setStatus("Requesting token...");
          const { token, room_url } = await getToken();

          callObject = window.Daily.createCallObject();
          callObject.on("joined-meeting", () => setStatus("Joined: " + room_url));
          callObject.on("left-meeting", () => setStatus("Left room"));
          callObject.on("error", (event) => setStatus("Error: " + JSON.stringify(event)));

          setStatus("Joining room...");
          await callObject.join({ url: room_url, token });

          joinBtn.disabled = true;
          leaveBtn.disabled = false;
        } catch (error) {
          setStatus("Join failed: " + error.message);
        }
      });

      leaveBtn.addEventListener("click", async () => {
        if (!callObject) return;
        await callObject.leave();
        callObject.destroy();
        callObject = null;

        joinBtn.disabled = false;
        leaveBtn.disabled = true;
      });

      startMicBtn.addEventListener("click", async () => {
        try {
          connectPipelineSocket();

          stopAssistantPlayback();
          setStatus("Barge-in: assistant interrupted. Listening...");

          activeMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(activeMicStream, { mimeType: "audio/webm" });
          mediaRecorder._shouldSendAudio = true;
          mediaRecorder._stopReason = "manual";
          micChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              micChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            stopVadMonitoring();

            const shouldSend = mediaRecorder?._shouldSendAudio !== false;
            const stopReason = mediaRecorder?._stopReason || "manual";

            startMicBtn.disabled = false;
            stopMicBtn.disabled = true;

            if (!shouldSend || micChunks.length === 0) {
              stopMicStream();
              setStatus("Recording stopped");
              return;
            }

            const blob = new Blob(micChunks, { type: "audio/webm" });
            const buffer = await blob.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            let binary = "";
            for (let i = 0; i < bytes.length; i++) {
              binary += String.fromCharCode(bytes[i]);
            }
            const audio_b64 = btoa(binary);

            if (!ws || ws.readyState !== WebSocket.OPEN) {
              stopMicStream();
              setStatus("Socket not connected");
              return;
            }

            ws.send(
              JSON.stringify({
                type: "user_audio",
                mime_type: "audio/webm",
                audio_b64,
              })
            );

            setStatus(
              stopReason === "manual"
                ? "Audio sent to pipeline"
                : `Audio sent to pipeline (${stopReason})`
            );

            stopMicStream();
          };

          mediaRecorder.start(250);
          startVadMonitoring(activeMicStream);

          startMicBtn.disabled = true;
          stopMicBtn.disabled = false;
          setStatus("Recording... VAD active (auto-stop on silence)");
        } catch (error) {
          stopVadMonitoring();
          stopMicStream();
          startMicBtn.disabled = false;
          stopMicBtn.disabled = true;
          setStatus("Mic error: " + error.message);
        }
      });

      stopMicBtn.addEventListener("click", () => {
        stopRecording(true, "manual");
      });
    </script>
  </body>
</html>
