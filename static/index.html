<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Agent Transport Layer</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      button {
        padding: 0.6rem 1rem;
        margin-right: 0.6rem;
        cursor: pointer;
      }

      #status {
        margin-top: 1rem;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Transport Layer (Daily WebRTC)</h1>
    <p>Transport + audio pipeline demo (mic → ASR → LLM → TTS).</p>

    <button id="join">Join Room</button>
    <button id="leave" disabled>Leave Room</button>
    <button id="startMic">Start Mic</button>
    <button id="stopMic" disabled>Stop Mic + Send</button>

    <div id="status">Idle</div>

    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <script>
      const status = document.getElementById("status");
      const joinBtn = document.getElementById("join");
      const leaveBtn = document.getElementById("leave");
      const startMicBtn = document.getElementById("startMic");
      const stopMicBtn = document.getElementById("stopMic");

      let callObject = null;
      let ws = null;
      let mediaRecorder = null;
      let micChunks = [];

      function setStatus(message) {
        status.textContent = message;
      }

      function connectPipelineSocket() {
        if (ws && ws.readyState === WebSocket.OPEN) return;
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${protocol}://${location.host}/ws/audio-pipeline`);

        ws.onopen = () => setStatus("Audio pipeline connected");
        ws.onclose = () => setStatus("Audio pipeline disconnected");
        ws.onerror = () => setStatus("Audio pipeline socket error");

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "ready") {
              setStatus("Pipeline ready");
              return;
            }
            if (data.type === "processing") {
              setStatus("Processing audio...");
              return;
            }
            if (data.type === "pipeline_result") {
              let msg = `Transcript: ${data.transcript}\nAssistant: ${data.assistant_text}`;
              setStatus(msg);

              if (data.assistant_audio_b64 && data.assistant_audio_mime) {
                const binary = atob(data.assistant_audio_b64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                  bytes[i] = binary.charCodeAt(i);
                }
                const blob = new Blob([bytes], { type: data.assistant_audio_mime });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                audio.play().finally(() => URL.revokeObjectURL(url));
              }
              return;
            }
            if (data.type === "error") {
              setStatus("Pipeline error: " + data.error);
            }
          } catch (error) {
            setStatus("Invalid pipeline message: " + error.message);
          }
        };
      }

      async function getToken() {
        const response = await fetch("/api/transport/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_name: "dev-client" }),
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

        return response.json();
      }

      joinBtn.addEventListener("click", async () => {
        try {
          connectPipelineSocket();
          setStatus("Requesting token...");
          const { token, room_url } = await getToken();

          callObject = window.Daily.createCallObject();
          callObject.on("joined-meeting", () => setStatus("Joined: " + room_url));
          callObject.on("left-meeting", () => setStatus("Left room"));
          callObject.on("error", (event) => setStatus("Error: " + JSON.stringify(event)));

          setStatus("Joining room...");
          await callObject.join({ url: room_url, token });

          joinBtn.disabled = true;
          leaveBtn.disabled = false;
        } catch (error) {
          setStatus("Join failed: " + error.message);
        }
      });

      leaveBtn.addEventListener("click", async () => {
        if (!callObject) return;
        await callObject.leave();
        callObject.destroy();
        callObject = null;

        joinBtn.disabled = false;
        leaveBtn.disabled = true;
      });

      startMicBtn.addEventListener("click", async () => {
        try {
          connectPipelineSocket();
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
          micChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              micChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            const blob = new Blob(micChunks, { type: "audio/webm" });
            const buffer = await blob.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            let binary = "";
            for (let i = 0; i < bytes.length; i++) {
              binary += String.fromCharCode(bytes[i]);
            }
            const audio_b64 = btoa(binary);

            if (!ws || ws.readyState !== WebSocket.OPEN) {
              setStatus("Socket not connected");
              return;
            }

            ws.send(JSON.stringify({
              type: "user_audio",
              mime_type: "audio/webm",
              audio_b64,
            }));
            setStatus("Audio sent to pipeline");

            stream.getTracks().forEach((track) => track.stop());
          };

          mediaRecorder.start(250);
          startMicBtn.disabled = true;
          stopMicBtn.disabled = false;
          setStatus("Recording... click 'Stop Mic + Send'");
        } catch (error) {
          setStatus("Mic error: " + error.message);
        }
      });

      stopMicBtn.addEventListener("click", () => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") return;
        mediaRecorder.stop();
        startMicBtn.disabled = false;
        stopMicBtn.disabled = true;
      });
    </script>
  </body>
</html>
