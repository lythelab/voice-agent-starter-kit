<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.svg" />
    <title>Voice Agent Transport Layer</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        --bg-top: #0a111c;
        --bg-bottom: #111d2d;
        --surface: rgba(16, 27, 42, 0.72);
        --surface-strong: rgba(20, 33, 51, 0.9);
        --text: #e7eefc;
        --muted: #a8bddc;
        --line: rgba(146, 179, 224, 0.22);
        --accent: #ef7b45;
        --accent-dark: #cb5f2d;
        --ok: #35c979;
        --warn: #e8a64e;
        --danger: #ff5f7f;
        --shadow: 0 24px 60px rgba(1, 4, 9, 0.52);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Outfit", "Segoe UI", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 14% 14%, #5d3d2a 0%, rgba(93, 61, 42, 0) 38%),
          radial-gradient(circle at 88% 20%, #1f3d5b 0%, rgba(31, 61, 91, 0) 44%),
          linear-gradient(165deg, var(--bg-top), var(--bg-bottom));
        padding: 24px;
        overflow-x: hidden;
      }

      .app {
        width: min(980px, 100%);
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: linear-gradient(150deg, var(--surface-strong), var(--surface));
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        padding: 26px;
        animation: rise 500ms ease-out;
      }

      .hero {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .title {
        margin: 0;
        font-size: clamp(1.5rem, 3.5vw, 2.2rem);
        letter-spacing: 0.01em;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(18, 30, 47, 0.78);
        padding: 10px 14px;
        font-size: 0.9rem;
        white-space: nowrap;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: #6a85ad;
      }

      .pill[data-tone="ok"] .dot {
        background: var(--ok);
      }

      .pill[data-tone="warn"] .dot {
        background: var(--warn);
      }

      .pill[data-tone="danger"] .dot {
        background: var(--danger);
      }

      .controls {
        margin-top: 22px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      button {
        font: inherit;
        font-weight: 600;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(19, 31, 49, 0.9);
        color: var(--text);
        padding: 12px;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: rgba(190, 214, 248, 0.36);
        box-shadow: 0 10px 24px rgba(2, 9, 18, 0.4);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .accent {
        background: linear-gradient(155deg, #ff9358, var(--accent));
        color: #fff;
        border-color: rgba(0, 0, 0, 0);
      }

      .accent:hover:not(:disabled) {
        box-shadow: 0 16px 30px rgba(239, 123, 69, 0.28);
        background: linear-gradient(155deg, #ffa26f, var(--accent-dark));
      }

      .stack {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .panel {
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(18, 30, 47, 0.74);
        padding: 14px;
        min-height: 150px;
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .panel p {
        margin: 0;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .metrics {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(18, 30, 47, 0.8);
        padding: 10px 12px;
      }

      .metric .k {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .metric .v {
        display: block;
        margin-top: 6px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.95rem;
      }

      #status {
        margin-top: 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(14, 26, 42, 0.86);
        padding: 11px 12px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.83rem;
        white-space: pre-wrap;
      }

      #status[data-tone="ok"] {
        border-color: rgba(31, 138, 76, 0.32);
      }

      #status[data-tone="warn"] {
        border-color: rgba(169, 97, 26, 0.34);
      }

      #status[data-tone="danger"] {
        border-color: rgba(185, 31, 58, 0.34);
      }

      @media (max-width: 860px) {
        .controls {
          grid-template-columns: 1fr 1fr;
        }

        .stack {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 12px;
        }

        .app {
          border-radius: 20px;
          padding: 16px;
        }

        .hero {
          flex-direction: column;
        }

        .controls,
        .metrics {
          grid-template-columns: 1fr;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div>
          <h1 class="title">Voice Agent Control Deck</h1>
          <p class="subtitle">One-page transport demo: mic -> ASR -> LLM -> TTS</p>
        </div>
        <div id="connectionState" class="pill" data-tone="warn">
          <span class="dot"></span>
          <span>Standby</span>
        </div>
      </section>

      <section class="controls">
        <button id="join" class="accent">Join Room</button>
        <button id="leave" disabled>Leave Room</button>
        <button id="startMic">Start Mic</button>
        <button id="stopMic" disabled>Stop Mic + Send</button>
      </section>

      <section class="stack">
        <article class="panel">
          <h2>Transcript</h2>
          <p id="transcriptText">Waiting for speech...</p>
        </article>
        <article class="panel">
          <h2>Assistant</h2>
          <p id="assistantText">Ready for response...</p>
        </article>
      </section>

      <section class="metrics">
        <article class="metric">
          <span class="k">Pipeline Latency</span>
          <span id="latencyStat" class="v">-</span>
        </article>
        <article class="metric">
          <span class="k">Client Roundtrip</span>
          <span id="roundTripStat" class="v">-</span>
        </article>
        <article class="metric">
          <span class="k">Audio Chunks</span>
          <span id="chunkStat" class="v">0</span>
        </article>
      </section>

      <div id="status" data-tone="warn">Idle</div>
    </main>

    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <script>
      const status = document.getElementById("status");
      const connectionState = document.getElementById("connectionState");
      const transcriptText = document.getElementById("transcriptText");
      const assistantText = document.getElementById("assistantText");
      const latencyStat = document.getElementById("latencyStat");
      const roundTripStat = document.getElementById("roundTripStat");
      const chunkStat = document.getElementById("chunkStat");

      const joinBtn = document.getElementById("join");
      const leaveBtn = document.getElementById("leave");
      const startMicBtn = document.getElementById("startMic");
      const stopMicBtn = document.getElementById("stopMic");

      let callObject = null;
      let ws = null;
      let mediaRecorder = null;
      let micChunks = [];
      let activeMicStream = null;
      let lastAudioSentAt = 0;

      let assistantAudioQueue = [];
      let assistantAudioPlaying = false;
      let currentAssistantAudio = null;
      let currentAssistantAudioUrl = null;
      let latestTranscript = "";
      let streamedAssistantText = "";

      let vadAudioContext = null;
      let vadSourceNode = null;
      let vadAnalyserNode = null;
      let vadIntervalId = null;
      let maxRecordTimeoutId = null;
      let vadLastSpeechAt = 0;
      let vadDetectedSpeech = false;

      const VAD_POLL_MS = 100;
      const VAD_SILENCE_MS = 500;
      const VAD_MAX_RECORDING_MS = 15000;
      const VAD_RMS_THRESHOLD = 0.02;

      function setConnectionState(label, tone = "warn") {
        connectionState.dataset.tone = tone;
        connectionState.lastElementChild.textContent = label;
      }

      function setStatus(message, tone = "warn") {
        status.textContent = message;
        status.dataset.tone = tone;
      }

      function updateStatusFromStream() {
        transcriptText.textContent = latestTranscript || "Waiting for speech...";
        assistantText.textContent = streamedAssistantText || "Ready for response...";
        setStatus("Streaming transcript + assistant text", "ok");
      }

      function playNextAssistantChunk() {
        if (assistantAudioPlaying || assistantAudioQueue.length === 0) return;

        const nextUrl = assistantAudioQueue.shift();
        assistantAudioPlaying = true;
        currentAssistantAudioUrl = nextUrl;
        currentAssistantAudio = new Audio(nextUrl);

        currentAssistantAudio.onended = () => {
          if (currentAssistantAudioUrl) {
            URL.revokeObjectURL(currentAssistantAudioUrl);
          }
          currentAssistantAudioUrl = null;
          currentAssistantAudio = null;
          assistantAudioPlaying = false;
          playNextAssistantChunk();
        };

        currentAssistantAudio.onerror = () => {
          if (currentAssistantAudioUrl) {
            URL.revokeObjectURL(currentAssistantAudioUrl);
          }
          currentAssistantAudioUrl = null;
          currentAssistantAudio = null;
          assistantAudioPlaying = false;
          playNextAssistantChunk();
        };

        currentAssistantAudio.play().catch(() => {
          if (currentAssistantAudioUrl) {
            URL.revokeObjectURL(currentAssistantAudioUrl);
          }
          currentAssistantAudioUrl = null;
          currentAssistantAudio = null;
          assistantAudioPlaying = false;
          playNextAssistantChunk();
        });
      }

      function enqueueAssistantAudioChunk(audioB64, mimeType) {
        const binary = atob(audioB64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const blob = new Blob([bytes], { type: mimeType });
        const url = URL.createObjectURL(blob);
        assistantAudioQueue.push(url);
        playNextAssistantChunk();
      }

      function stopAssistantPlayback() {
        if (currentAssistantAudio) {
          currentAssistantAudio.pause();
          currentAssistantAudio.currentTime = 0;
          currentAssistantAudio = null;
        }
        if (currentAssistantAudioUrl) {
          URL.revokeObjectURL(currentAssistantAudioUrl);
          currentAssistantAudioUrl = null;
        }
        for (const queuedUrl of assistantAudioQueue) {
          URL.revokeObjectURL(queuedUrl);
        }
        assistantAudioQueue = [];
        assistantAudioPlaying = false;
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
      }

      function speakInBrowser(text) {
        if (!text || !window.speechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }

      function stopVadMonitoring() {
        if (vadIntervalId) {
          clearInterval(vadIntervalId);
          vadIntervalId = null;
        }
        if (maxRecordTimeoutId) {
          clearTimeout(maxRecordTimeoutId);
          maxRecordTimeoutId = null;
        }
        if (vadSourceNode) {
          vadSourceNode.disconnect();
          vadSourceNode = null;
        }
        if (vadAnalyserNode) {
          vadAnalyserNode.disconnect();
          vadAnalyserNode = null;
        }
        if (vadAudioContext) {
          vadAudioContext.close().catch(() => {});
          vadAudioContext = null;
        }
      }

      function stopMicStream() {
        if (!activeMicStream) return;
        activeMicStream.getTracks().forEach((track) => track.stop());
        activeMicStream = null;
      }

      function stopRecording(sendAudio = true, reason = "manual") {
        if (!mediaRecorder || mediaRecorder.state === "inactive") return;
        mediaRecorder._shouldSendAudio = sendAudio;
        mediaRecorder._stopReason = reason;
        mediaRecorder.stop();
      }

      function startVadMonitoring(stream) {
        vadAudioContext = new AudioContext();
        vadSourceNode = vadAudioContext.createMediaStreamSource(stream);
        vadAnalyserNode = vadAudioContext.createAnalyser();
        vadAnalyserNode.fftSize = 2048;
        vadSourceNode.connect(vadAnalyserNode);

        const samples = new Float32Array(vadAnalyserNode.fftSize);
        vadLastSpeechAt = Date.now();
        vadDetectedSpeech = false;

        vadIntervalId = setInterval(() => {
          if (!mediaRecorder || mediaRecorder.state === "inactive") return;

          vadAnalyserNode.getFloatTimeDomainData(samples);

          let sum = 0;
          for (let i = 0; i < samples.length; i++) {
            sum += samples[i] * samples[i];
          }
          const rms = Math.sqrt(sum / samples.length);

          if (rms >= VAD_RMS_THRESHOLD) {
            vadDetectedSpeech = true;
            vadLastSpeechAt = Date.now();
            return;
          }

          if (vadDetectedSpeech && Date.now() - vadLastSpeechAt >= VAD_SILENCE_MS) {
            setStatus("VAD: silence detected, sending audio...", "warn");
            stopRecording(true, "vad_silence");
          }
        }, VAD_POLL_MS);

        maxRecordTimeoutId = setTimeout(() => {
          if (!mediaRecorder || mediaRecorder.state === "inactive") return;
          setStatus("VAD: max utterance reached, sending audio...", "warn");
          stopRecording(true, "max_duration");
        }, VAD_MAX_RECORDING_MS);
      }

      function connectPipelineSocket() {
        if (ws && ws.readyState === WebSocket.OPEN) return;
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${protocol}://${location.host}/ws/audio-pipeline`);

        ws.onopen = () => {
          setConnectionState("Pipeline connected", "ok");
          setStatus("Audio pipeline connected", "ok");
        };
        ws.onclose = () => {
          setConnectionState("Pipeline disconnected", "warn");
          setStatus("Audio pipeline disconnected", "warn");
        };
        ws.onerror = () => {
          setConnectionState("Pipeline error", "danger");
          setStatus("Audio pipeline socket error", "danger");
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "ready") {
              setStatus("Pipeline ready", "ok");
              return;
            }
            if (data.type === "processing") {
              setStatus("Processing audio...", "warn");
              return;
            }
            if (data.type === "transcript") {
              latestTranscript = data.transcript || "";
              streamedAssistantText = "";
              updateStatusFromStream();
              return;
            }
            if (data.type === "assistant_text_delta") {
              streamedAssistantText += data.delta || "";
              updateStatusFromStream();
              return;
            }
            if (data.type === "assistant_audio_chunk") {
              if (data.audio_b64 && data.audio_mime) {
                enqueueAssistantAudioChunk(data.audio_b64, data.audio_mime);
              }
              return;
            }
            if (data.type === "pipeline_result") {
              const latency = data.latency_ms || {};
              const clientRoundTripMs =
                lastAudioSentAt > 0 ? Math.round(performance.now() - lastAudioSentAt) : null;
              latestTranscript = data.transcript || latestTranscript;
              streamedAssistantText = data.assistant_text || streamedAssistantText;

              transcriptText.textContent = latestTranscript || "Waiting for speech...";
              assistantText.textContent = streamedAssistantText || "Ready for response...";

              latencyStat.textContent =
                latency.total !== undefined
                  ? `asr ${latency.asr} / llm ${latency.llm} / tts ${latency.tts} / total ${latency.total} ms`
                  : "-";
              roundTripStat.textContent =
                clientRoundTripMs !== null ? `${clientRoundTripMs} ms` : "-";
              chunkStat.textContent = String(data.audio_chunk_count ?? 0);

              setStatus("Pipeline response complete", "ok");

              if (!data.assistant_audio_streamed) {
                stopAssistantPlayback();
                speakInBrowser(streamedAssistantText);
              }
              return;
            }
            if (data.type === "error") {
              setStatus("Pipeline error: " + data.error, "danger");
            }
          } catch (error) {
            setStatus("Invalid pipeline message: " + error.message, "danger");
          }
        };
      }

      async function getToken() {
        const response = await fetch("/api/transport/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_name: "dev-client" }),
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

        return response.json();
      }

      joinBtn.addEventListener("click", async () => {
        try {
          connectPipelineSocket();
          setStatus("Requesting token...", "warn");
          const { token, room_url } = await getToken();

          callObject = window.Daily.createCallObject();
          callObject.on("joined-meeting", () => {
            setConnectionState("In room", "ok");
            setStatus("Joined: " + room_url, "ok");
          });
          callObject.on("left-meeting", () => {
            setConnectionState("Left room", "warn");
            setStatus("Left room", "warn");
          });
          callObject.on("error", (event) => {
            setConnectionState("Transport error", "danger");
            setStatus("Error: " + JSON.stringify(event), "danger");
          });

          setStatus("Joining room...", "warn");
          await callObject.join({ url: room_url, token });

          joinBtn.disabled = true;
          leaveBtn.disabled = false;
        } catch (error) {
          setConnectionState("Join failed", "danger");
          setStatus("Join failed: " + error.message, "danger");
        }
      });

      leaveBtn.addEventListener("click", async () => {
        if (!callObject) return;
        await callObject.leave();
        callObject.destroy();
        callObject = null;

        joinBtn.disabled = false;
        leaveBtn.disabled = true;
        setConnectionState("Standby", "warn");
      });

      startMicBtn.addEventListener("click", async () => {
        try {
          connectPipelineSocket();

          stopAssistantPlayback();
          setStatus("Barge-in: assistant interrupted. Listening...", "warn");

          activeMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(activeMicStream, { mimeType: "audio/webm" });
          mediaRecorder._shouldSendAudio = true;
          mediaRecorder._stopReason = "manual";
          micChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              micChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            stopVadMonitoring();

            const shouldSend = mediaRecorder?._shouldSendAudio !== false;
            const stopReason = mediaRecorder?._stopReason || "manual";

            startMicBtn.disabled = false;
            stopMicBtn.disabled = true;

            if (!shouldSend || micChunks.length === 0) {
              stopMicStream();
              setStatus("Recording stopped", "warn");
              return;
            }

            const blob = new Blob(micChunks, { type: "audio/webm" });
            const buffer = await blob.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            let binary = "";
            for (let i = 0; i < bytes.length; i++) {
              binary += String.fromCharCode(bytes[i]);
            }
            const audio_b64 = btoa(binary);

            if (!ws || ws.readyState !== WebSocket.OPEN) {
              stopMicStream();
              setStatus("Socket not connected", "danger");
              return;
            }

            ws.send(
              JSON.stringify({
                type: "user_audio",
                mime_type: "audio/webm",
                audio_b64,
              })
            );
            lastAudioSentAt = performance.now();

            setStatus(
              stopReason === "manual"
                ? "Audio sent to pipeline"
                : `Audio sent to pipeline (${stopReason})`,
              "ok"
            );

            stopMicStream();
          };

          mediaRecorder.start(250);
          startVadMonitoring(activeMicStream);

          startMicBtn.disabled = true;
          stopMicBtn.disabled = false;
          setStatus("Recording... VAD active (auto-stop on silence)", "warn");
        } catch (error) {
          stopVadMonitoring();
          stopMicStream();
          startMicBtn.disabled = false;
          stopMicBtn.disabled = true;
          setStatus("Mic error: " + error.message, "danger");
        }
      });

      stopMicBtn.addEventListener("click", () => {
        stopRecording(true, "manual");
      });
    </script>
  </body>
</html>
